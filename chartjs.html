<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Implementando o ChartJs</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="grafico-linhas">
        <h1>Gráfico de Linhas</h1>
        <canvas id="myChartLinhas" style="position: relative; height:40vh; width:60vw"></canvas>
    </div><br>

    <div class="grafico-barras">
        <h1>Gráfico de Barras</h1>
        <canvas id="myChartBarras"></canvas><br>
    </div>

</body>

</html>
<script>
    const gLinha = document.getElementById('myChartLinhas');

    new Chart(gLinha, {
        type: 'line',
        data: {
            labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
            datasets: [{
                label: 'Temperatura',
                data: [30, 29, 28, 25, 22, 23],
                borderWidth: 1
            },
            {
                label: 'Umidade',
                data: [80, 82, 80, 85, 80, 83],
                borderWidth: 1
            },]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    const gBarra = document.getElementById('myChartBarras');

    new Chart(gBarra, {
        type: 'bar',
        data: {
            labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],
            datasets: [{
                label: 'Temperatura Média',
                data: [22, 24, 27, 23, 20, 18],
                borderWidth: 1
            },
        {
                label: 'Umidade Média',
                data: [22, 24, 27, 23, 20, 18],
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

</script>
